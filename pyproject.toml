[project]
name = "QAILab"
version = "0.1.2"
description = "Library providing easy to use PyTorch compatible Quantum Neural Network Layers for both universal and photonic quantum computers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qiskit>=1.4.0,<2.0",
    "qiskit-machine-learning>=0.8.2",
    "torch",
    "tqdm",
    "scikit-learn",
    "pandas",
    "requests",
    "qlauncher"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qailab*"]

[project.optional-dependencies]
test = ["pytest", "pylint", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", # pycodestyle errors
          "W", # pycodestyle warnings
          "F", # pyflakes
          "I", # isort
          "B", # flake8-bugbear
          "UP", # pyupgrade
          "C4", # flake8-comprehensions
          "SIM", # flake8-simplify
          "ANN", # flake8-annotations
          "FA", # flake8-future-annotations
          "ISC", # flake8-implicit-str-concat
          "ICN", # flake8-import-conventions
          "RET", # flake8-return
          "TID", # flake8-tidy-imports
          "TC", # flake8-type-checking
          "TD", # flake8-todos
          "NPY", # NumPy-specific rules
]
ignore = ["W191", "E111", "E114", "E117", "E501", "D206", "D300", "ISC002", "ANN003", "ANN204"]

